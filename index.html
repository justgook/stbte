<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STB Tilemap Editor - Headless WASM</title>
  <style>
    body {
      font-family: monospace;
      margin: 20px;
      background: #1a1a1a;
      color: #ddd;
    }
    h1 { color: #8f8; }
    h2 { color: #88f; margin-top: 30px; }
    .section {
      background: #2a2a2a;
      padding: 15px;
      margin: 10px 0;
      border-radius: 5px;
    }
    button {
      background: #444;
      color: #fff;
      border: 1px solid #666;
      padding: 8px 15px;
      margin: 5px;
      cursor: pointer;
      border-radius: 3px;
    }
    button:hover { background: #555; }
    button.active { background: #484; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .tool-btn { min-width: 100px; }
    .layer-btn { min-width: 80px; }
    #tilemap {
      border: 2px solid #666;
      background: #000;
      cursor: crosshair;
      image-rendering: pixelated;
    }
    .info {
      font-size: 12px;
      color: #888;
    }
    .tile-grid {
      display: grid;
      grid-template-columns: repeat(8, 32px);
      gap: 2px;
      margin: 10px 0;
    }
    .tile-btn {
      width: 32px;
      height: 32px;
      background: #333;
      border: 1px solid #555;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }
    .tile-btn:hover { background: #444; }
    .tile-btn.active { border: 2px solid #8f8; }
    .category-tabs {
      display: flex;
      gap: 5px;
      margin: 10px 0;
    }
    .category-tab {
      padding: 5px 15px;
      background: #333;
      border: 1px solid #555;
      cursor: pointer;
    }
    .category-tab:hover { background: #444; }
    .category-tab.active { background: #448; border-color: #66f; }
    #output {
      background: #111;
      padding: 10px;
      border-radius: 3px;
      font-size: 11px;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>STB Tilemap Editor - Headless WASM</h1>
  <p class="info">Minimal API: Actions only. State accessed via memory pointers.</p>

  <div class="section">
    <h2>Tools</h2>
    <div id="tools">
      <button class="tool-btn" data-tool="0">Select</button>
      <button class="tool-btn active" data-tool="1">Brush</button>
      <button class="tool-btn" data-tool="2">Erase</button>
      <button class="tool-btn" data-tool="3">Eyedropper</button>
    </div>
    <div style="margin-top: 10px;">
      <button id="undo-btn">Undo</button>
      <button id="redo-btn">Redo</button>
      <button id="cut-btn">Cut</button>
      <button id="copy-btn">Copy</button>
      <button id="paste-btn">Paste</button>
    </div>
  </div>

  <div class="section">
    <h2>Layers</h2>
    <div id="layers"></div>
  </div>

  <div class="section">
    <h2>Categories</h2>
    <div id="categories" class="category-tabs"></div>
  </div>

  <div class="section">
    <h2>Tiles</h2>
    <div id="tiles" class="tile-grid"></div>
  </div>

  <div class="section">
    <h2>Map <span class="info">(Click to draw, Right-click to erase)</span></h2>
    <canvas id="tilemap" width="640" height="480"></canvas>
    <div style="margin-top: 10px;">
      <button id="clear-btn">Clear Map</button>
      <button id="grid-btn">Toggle Grid</button>
    </div>
  </div>

  <div class="section">
    <h2>Debug Output</h2>
    <div id="output">Loading WASM...</div>
  </div>

  <script type="module">
    class STBTileEditor {
      constructor() {
        this.wasm = null;
        this.memory = null;
        this.exports = null;
        this.tilemap = 0;
        this.tileSize = 32;
        this.mapWidth = 20;
        this.mapHeight = 15;
        this.layers = 3;
        this.currentTool = 1;
        this.selectedTile = 0;
        this.selectedLayer = -1;
        this.selectedCategory = -1;
        this.showGrid = true;
        this.offsets = {};
        
        // Frontend-only names (not passed to WASM)
        // Note: category 0 is special (includes all tiles), categories 1-3 are user-defined
        this.categoryNames = ['All', 'Floor', 'Walls', 'Objects', 'Misc'];
        this.layerNames = ['Ground', 'Mid', 'Top'];
      }

      async init() {
        try {
          log('Starting WASM initialization...');
          
          const response = await fetch('./stb_tilemap_editor.wasm');
          log('WASM file fetched');
          const wasmBytes = await response.arrayBuffer();
          log(`WASM file size: ${wasmBytes.byteLength} bytes`);
          
          // Create shared memory for WASM import (must match WASM --initial-memory)
          const memory = new WebAssembly.Memory({
            initial: 288,  // 288 pages = 18MB (matches WASM --initial-memory)
            maximum: 512,  // 512 pages = 32MB
            shared: true
          });
          log('Shared memory created');
          
          const importObject = { env: { memory } };
          
          log('Instantiating WASM...');
          const { instance } = await WebAssembly.instantiate(wasmBytes, importObject);
          this.wasm = instance;
          this.memory = memory;  // Use imported memory
          this.exports = instance.exports;
          
          console.log('=== WASM Exported Functions ===');
          const exports = Object.keys(instance.exports).sort();
          exports.forEach(name => console.log(`  ${name}: ${typeof instance.exports[name]}`));
          console.log(`Total exports: ${exports.length}`);
          
          log('Loading offsets...');
          this.loadOffsets();
          log('Offsets loaded');
          
          log('About to call stbte_create...');
          this.tilemap = this.exports.stbte_create(
            this.mapWidth, this.mapHeight, this.layers,
            this.tileSize, this.tileSize, 256
          );
          log(`stbte_create returned: ${this.tilemap} (0x${this.tilemap.toString(16)})`);
          
          if (this.tilemap === 0) {
            log('ERROR: stbte_create returned 0 (null pointer)');
            return;
          }
          
          log(`Tilemap created successfully`);
          
          // Debug: Check tilemap values after creation
          log(`num_tiles offset: ${this.offsets.tm_num_tiles}`);
          log(`Initial num_tiles: ${this.getNumTiles()}`);
          
          log('Defining tiles...');
          this.defineTiles();
          log('Tiles defined');
        
        // Debug: Check after defining tiles
        const numTiles = this.getNumTiles();
        const numCats = this.getNumCategories();
        log(`After defineTiles - num_tiles: ${numTiles}`);
        log(`After defineTiles - num_categories: ${numCats}`);
        
        // Read tiles pointer
        const tilesPtr = this.readTilemap(this.offsets.tm_tiles, 'i32');
        log(`tiles pointer value: 0x${tilesPtr.toString(16)}`);
        
        // Check if tiles pointer is valid
        if (tilesPtr > 0 && tilesPtr < this.memory.buffer.byteLength) {
          // Try reading first tile
          const tileBase = tilesPtr;
          const tileId = new DataView(this.memory.buffer, tileBase + this.offsets.tileinfo_id, 2).getUint16(0, true);
          log(`First tile ID: ${tileId}`);
        } else {
          log(`Invalid tiles pointer!`);
        }
        
        this.exports.stbte_set_background_tile(this.tilemap, 0);
        log('Background tile set');
        
        log('Setting up UI...');
        this.setupUI();
        log('UI setup complete');
        
        log('Rendering...');
        this.render();
        log('Render complete - initialization finished!');
        
        } catch (e) {
          log(`FATAL ERROR: ${e.message}`);
          log(`Stack: ${e.stack}`);
          console.error('Initialization error:', e);
          throw e;
        }
      }

      loadOffsets() {
        const names = [
          'stbte_offset_tilemap_max_x', 'stbte_offset_tilemap_max_y',
          'stbte_offset_tilemap_num_layers', 'stbte_offset_tilemap_num_tiles',
          'stbte_offset_tilemap_cur_tile', 'stbte_offset_tilemap_cur_layer',
          'stbte_offset_tilemap_solo_layer', 'stbte_offset_tilemap_cur_category',
          'stbte_offset_tilemap_background_tile', 'stbte_offset_tilemap_num_categories',
          'stbte_offset_tilemap_data', 'stbte_offset_tilemap_tiles',
          'stbte_offset_tilemap_layerinfo', 'stbte_offset_tilemap_undo_available',
          'stbte_offset_tilemap_redo_available', 'stbte_offset_layer_hidden',
          'stbte_offset_layer_locked', 'stbte_offset_tileinfo_id',
          'stbte_offset_tileinfo_layermask', 'stbte_offset_tileinfo_category_id',
          'stbte_offset_ui_tool', 'stbte_offset_ui_has_selection',
          'stbte_offset_ui_select_x0', 'stbte_offset_ui_select_y0',
          'stbte_offset_ui_select_x1', 'stbte_offset_ui_select_y1',
          'stbte_offset_ui_has_copy', 'stbte_offset_ui_copy_width',
          'stbte_offset_ui_copy_height', 'stbte_offset_ui_copybuffer',
        ];
        
        names.forEach(name => {
          this.offsets[name.replace('stbte_offset_', '').replace('tilemap_', 'tm_')] = this.exports[name]();
        });
        
        this.offsets.sizeof_tilemap = this.exports.stbte_sizeof_tilemap();
        this.offsets.sizeof_layer = this.exports.stbte_sizeof_layer();
        this.offsets.sizeof_tileinfo = this.exports.stbte_sizeof_tileinfo();
        this.offsets.sizeof_ui = this.exports.stbte_sizeof_ui();
        this.offsets.max_map_x = this.exports.stbte_max_map_x();
        this.offsets.max_map_y = this.exports.stbte_max_map_y();
        this.offsets.max_layers = this.exports.stbte_max_layers();
        
        // Absolute address of the global stbte__ui struct in WASM memory
        this.uiPtr = this.exports.stbte_ui_ptr();
        
        console.log('Offsets loaded:', this.offsets);
        console.log('UI pointer:', this.uiPtr);
      }

      readTilemap(offset, type = 'i32') {
        const view = new DataView(this.memory.buffer, this.tilemap + offset);
        switch (type) {
          case 'i8': return view.getInt8(0);
          case 'i16': return view.getInt16(0, true);
          case 'i32': return view.getInt32(0, true);
          default: return view.getInt32(0, true);
        }
      }

      readUI(offset, type = 'i32') {
        const view = new DataView(this.memory.buffer, this.uiPtr + offset);
        switch (type) {
          case 'i8': return view.getInt8(0);
          case 'i16': return view.getInt16(0, true);
          case 'i32': return view.getInt32(0, true);
          default: return view.getInt32(0, true);
        }
      }

      getNumTiles() { return this.readTilemap(this.offsets.tm_num_tiles, 'i32'); }
      getNumCategories() { return this.readTilemap(this.offsets.tm_num_categories, 'i32'); }
      getCurrentCategory() { return this.readTilemap(this.offsets.tm_cur_category, 'i32'); }
      getCurrentTile() { return this.readTilemap(this.offsets.tm_cur_tile, 'i32'); }
      canUndo() { return this.readTilemap(this.offsets.tm_undo_available, 'i8'); }
      canRedo() { return this.readTilemap(this.offsets.tm_redo_available, 'i8'); }
      hasSelection() { return this.readUI(this.offsets.ui_has_selection, 'i32'); }
      hasCopy() { return this.readUI(this.offsets.ui_has_copy, 'i32'); }

      defineTiles() {
        const tiles = [
          { id: 0, mask: 0xFF, cat: 0 }, { id: 1, mask: 0x01, cat: 1 },
          { id: 2, mask: 0x01, cat: 1 }, { id: 3, mask: 0x01, cat: 1 },
          { id: 10, mask: 0x02, cat: 2 }, { id: 11, mask: 0x02, cat: 2 },
          { id: 12, mask: 0x02, cat: 2 }, { id: 20, mask: 0x04, cat: 3 },
          { id: 21, mask: 0x04, cat: 3 }, { id: 22, mask: 0x04, cat: 3 },
          { id: 23, mask: 0x04, cat: 3 },
        ];
        tiles.forEach(t => this.exports.stbte_define_tile(this.tilemap, t.id, t.mask, t.cat));
        log(`Defined ${tiles.length} tiles`);
      }

      setupUI() {
        document.querySelectorAll('.tool-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.currentTool = parseInt(btn.dataset.tool);
            this.exports.stbte_set_tool(this.tilemap, this.currentTool);
          });
        });

        document.getElementById('undo-btn').addEventListener('click', () => {
          this.exports.stbte_undo(this.tilemap);
          this.render();
          log('Undo');
        });
        
        document.getElementById('redo-btn').addEventListener('click', () => {
          this.exports.stbte_redo(this.tilemap);
          this.render();
          log('Redo');
        });

        document.getElementById('cut-btn').addEventListener('click', () => {
          this.exports.stbte_cut(this.tilemap);
          this.render();
          log('Cut');
        });
        
        document.getElementById('copy-btn').addEventListener('click', () => {
          this.exports.stbte_copy(this.tilemap);
          log('Copy');
        });
        
        document.getElementById('paste-btn').addEventListener('click', () => {
          const cx = Math.floor(this.mapWidth / 2);
          const cy = Math.floor(this.mapHeight / 2);
          this.exports.stbte_paste(this.tilemap, cx, cy);
          this.render();
          log(`Paste at ${cx},${cy}`);
        });

        document.getElementById('clear-btn').addEventListener('click', () => {
          this.exports.stbte_clear(this.tilemap);
          this.render();
          log('Cleared');
        });

        document.getElementById('grid-btn').addEventListener('click', () => {
          this.showGrid = !this.showGrid;
          this.render();
        });

        const canvas = document.getElementById('tilemap');
        let isDragging = false;
        let areaDrag = false;  // true when dragging to define an area (select tool, or shift+brush)
        this.dragStartX = -1;
        this.dragStartY = -1;
        this.dragEndX = -1;
        this.dragEndY = -1;
        this.showDragPreview = false;

        // Select always drags an area; brush/erase do area-drag when shift is held
        const isAreaDrag = (e) => this.currentTool === 0 || (e.shiftKey && (this.currentTool === 1 || this.currentTool === 2));

        canvas.addEventListener('mousedown', (e) => {
          const rect = canvas.getBoundingClientRect();
          const x = Math.floor((e.clientX - rect.left) / this.tileSize);
          const y = Math.floor((e.clientY - rect.top) / this.tileSize);
          
          if (x >= 0 && x < this.mapWidth && y >= 0 && y < this.mapHeight) {
            isDragging = true;
            this.dragStartX = x;
            this.dragStartY = y;

            if (isAreaDrag(e)) {
              areaDrag = true;
              this.dragEndX = x;
              this.dragEndY = y;
              this.showDragPreview = true;
              this.render();
            } else {
              areaDrag = false;
              this.showDragPreview = false;
              this.exports.stbte_apply(this.tilemap, x, y, x, y);
              this.render();
              log(`Click ${x},${y}`);
            }
          }
        });

        canvas.addEventListener('mousemove', (e) => {
          if (!isDragging) return;
          const rect = canvas.getBoundingClientRect();
          const x = Math.floor((e.clientX - rect.left) / this.tileSize);
          const y = Math.floor((e.clientY - rect.top) / this.tileSize);
          if (x < 0 || x >= this.mapWidth || y < 0 || y >= this.mapHeight) return;

          if (areaDrag) {
            this.dragEndX = x;
            this.dragEndY = y;
            this.render();
          } else if (this.currentTool === 1 || this.currentTool === 2) {
            this.exports.stbte_apply(this.tilemap, x, y, x, y);
            this.render();
          }
        });

        canvas.addEventListener('mouseup', (e) => {
          if (isDragging && areaDrag) {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / this.tileSize);
            const y = Math.floor((e.clientY - rect.top) / this.tileSize);
            const ex = Math.max(0, Math.min(x, this.mapWidth - 1));
            const ey = Math.max(0, Math.min(y, this.mapHeight - 1));
            this.exports.stbte_apply(this.tilemap, this.dragStartX, this.dragStartY, ex, ey);
            const toolName = ['Select', 'Area fill', 'Area erase'][this.currentTool] || 'Apply';
            log(`${toolName} (${this.dragStartX},${this.dragStartY})-(${ex},${ey})`);
            this.showDragPreview = false;
            this.render();
          }
          isDragging = false;
          areaDrag = false;
        });
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        this.setupLayers();
        this.setupCategories();
        this.setupTiles();
      }

      setupLayers() {
        const container = document.getElementById('layers');
        container.innerHTML = '';
        container.style.display = 'flex';
        container.style.flexDirection = 'column';
        container.style.gap = '5px';
        
        for (let i = this.layers - 1; i >= 0; i--) { // Show top layer first
          const layerRow = document.createElement('div');
          layerRow.style.display = 'flex';
          layerRow.style.alignItems = 'center';
          layerRow.style.gap = '5px';
          layerRow.style.padding = '5px';
          layerRow.style.background = i === this.selectedLayer ? '#484' : '#333';
          layerRow.style.borderRadius = '3px';
          layerRow.style.cursor = 'pointer';
          
          // Layer name (click to select)
          const nameSpan = document.createElement('span');
          nameSpan.textContent = this.layerNames[i] || `Layer ${i + 1}`;
          nameSpan.style.flex = '1';
          nameSpan.style.fontWeight = i === this.selectedLayer ? 'bold' : 'normal';
          nameSpan.addEventListener('click', () => {
            this.selectedLayer = this.selectedLayer === i ? -1 : i;
            this.exports.stbte_set_active_layer(this.tilemap, this.selectedLayer);
            this.setupLayers();
            log(`Layer: ${this.selectedLayer}`);
          });
          layerRow.appendChild(nameSpan);
          
          // Read layer state from memory (tilemap base + layerinfo offset + per-layer stride)
          const layerOffset = this.tilemap + this.offsets.tm_layerinfo + (i * this.offsets.sizeof_layer);
          const hidden = new DataView(this.memory.buffer, layerOffset + this.offsets.layer_hidden, 4).getInt32(0, true);
          const locked = new DataView(this.memory.buffer, layerOffset + this.offsets.layer_locked, 4).getInt32(0, true);
          const soloLayer = this.readTilemap(this.offsets.tm_solo_layer, 'i32');
          const isSolo = soloLayer === i;
          
          // Debug log current state
          log(`Layer ${i}: hidden=${hidden}, locked=${locked}, solo=${isSolo}`);
          
          // Toggle buttons
          const toggles = [
            { label: 'H', title: 'Hidden', state: hidden, action: () => {
              const newHidden = hidden ? 0 : 1;
              log(`Setting layer ${i} hidden to ${newHidden}`);
              this.exports.stbte_set_layer_hidden(this.tilemap, i, newHidden);
              // Verify it was set
              const verifyHidden = new DataView(this.memory.buffer, layerOffset + this.offsets.layer_hidden, 4).getInt32(0, true);
              log(`Verified hidden=${verifyHidden}`);
              this.setupLayers();
              this.render();
            }},
            { label: 'L', title: 'Locked', state: locked, action: () => {
              const newLocked = locked ? 0 : 1;
              this.exports.stbte_set_layer_locked(this.tilemap, i, newLocked);
              this.setupLayers();
              this.render();
              log(`Layer ${i}: ${newLocked ? 'Locked' : 'Unlocked'}`);
            }},
            { label: 'S', title: 'Solo', state: isSolo, action: () => {
              const newSolo = isSolo ? -1 : i;
              this.exports.stbte_set_solo_layer(this.tilemap, newSolo);
              this.setupLayers();
              this.render();
              log(`Solo layer: ${newSolo}`);
            }}
          ];
          
          toggles.forEach(toggle => {
            const btn = document.createElement('button');
            btn.textContent = toggle.label;
            btn.title = toggle.title;
            btn.style.minWidth = '30px';
            btn.style.padding = '2px 5px';
            btn.style.fontSize = '10px';
            btn.style.background = toggle.state ? '#8f8' : '#555';
            btn.style.color = toggle.state ? '#000' : '#fff';
            btn.style.border = '1px solid #666';
            btn.style.borderRadius = '2px';
            btn.style.cursor = 'pointer';
            btn.addEventListener('click', (e) => {
              e.stopPropagation();
              toggle.action();
            });
            layerRow.appendChild(btn);
          });
          
          container.appendChild(layerRow);
        }
      }

      setupCategories() {
        const container = document.getElementById('categories');
        container.innerHTML = '';
        
        // Force category computation by calling set_active_category
        this.exports.stbte_set_active_category(this.tilemap, this.selectedCategory);
        
        const catCount = this.getNumCategories();
        log(`Setting up ${catCount} categories`);
        
        // Always show "All" tab
        const allTab = document.createElement('div');
        allTab.className = 'category-tab' + (this.selectedCategory === -1 ? ' active' : '');
        allTab.textContent = this.categoryNames[0] || 'All';
        allTab.addEventListener('click', () => {
          this.selectedCategory = -1;
          this.exports.stbte_set_active_category(this.tilemap, -1);
          this.setupCategories();
          this.setupTiles();
        });
        container.appendChild(allTab);
        
        // Show all computed categories
        for (let i = 0; i < catCount; i++) {
          const tab = document.createElement('div');
          tab.className = 'category-tab' + (this.selectedCategory === i ? ' active' : '');
          // Use frontend name array, fallback to "Cat N"
          const catName = this.categoryNames[i + 1] || `Cat ${i}`;
          tab.textContent = catName;
          tab.addEventListener('click', () => {
            this.selectedCategory = i;
            this.exports.stbte_set_active_category(this.tilemap, i);
            this.setupCategories();
            this.setupTiles();
          });
          container.appendChild(tab);
        }
      }

      setupTiles() {
        const container = document.getElementById('tiles');
        container.innerHTML = '';
        const tileCount = this.getNumTiles();
        const activeCat = this.getCurrentCategory();
        
        // Debug logging
        log(`setupTiles: tileCount=${tileCount}, activeCat=${activeCat}`);
        log(`tm_tiles offset: ${this.offsets.tm_tiles}`);
        
        const tilesPtr = this.readTilemap(this.offsets.tm_tiles, 'i32');
        log(`tilesPtr: 0x${tilesPtr.toString(16)}`);
        
        const currentTileIdx = this.getCurrentTile();
        
        let visibleCount = 0;
        for (let i = 0; i < tileCount; i++) {
          const tileBase = tilesPtr + (i * this.offsets.sizeof_tileinfo);
          const tileId = new DataView(this.memory.buffer, tileBase + this.offsets.tileinfo_id, 2).getUint16(0, true);
          const tileCat = new DataView(this.memory.buffer, tileBase + this.offsets.tileinfo_category_id, 2).getUint16(0, true);
          
          if (activeCat !== -1 && tileCat !== activeCat) continue;
          
          visibleCount++;
          const btn = document.createElement('div');
          btn.className = 'tile-btn' + (i === currentTileIdx ? ' active' : '');
          btn.textContent = tileId;
          
          // Capture the actual tile index in a closure
          ((tileIndex, tileID) => {
            btn.addEventListener('click', () => {
              this.exports.stbte_set_active_tile(this.tilemap, tileIndex);
              this.setupTiles();
              log(`Selected tile index: ${tileIndex}, ID: ${tileID}`);
            });
          })(i, tileId);
          
          container.appendChild(btn);
        }
        
        log(`setupTiles: visibleCount=${visibleCount}`);
      }

      render() {
        const canvas = document.getElementById('tilemap');
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // tm_data is offset 0, data is embedded in struct at tilemap pointer
        // Important: data is stored as [MAX_Y][MAX_X][MAX_LAYERS], not [mapHeight][mapWidth][layers]
        const dataOffset = this.tilemap + this.offsets.tm_data;
        const maxX = this.offsets.max_map_x;  // 512
        const maxLayers = this.offsets.max_layers;  // 8
        
        // Get solo layer state (-1 means no solo)
        const soloLayer = this.readTilemap(this.offsets.tm_solo_layer, 'i32');
        
        for (let y = 0; y < this.mapHeight; y++) {
          for (let x = 0; x < this.mapWidth; x++) {
            const px = x * this.tileSize;
            const py = y * this.tileSize;
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(px, py, this.tileSize, this.tileSize);
            
            for (let l = 0; l < this.layers; l++) {
              // Check if layer is hidden (tilemap base + layerinfo offset + per-layer stride)
              const layerOffset = this.tilemap + this.offsets.tm_layerinfo + (l * this.offsets.sizeof_layer);
              const hidden = new DataView(this.memory.buffer, layerOffset + this.offsets.layer_hidden, 4).getInt32(0, true);
              
              // Skip hidden layers
              if (hidden) continue;
              
              // If solo layer is set, only show that layer
              if (soloLayer >= 0 && l !== soloLayer) continue;
              
              // Index into the MAX-sized array: (y * MAX_X + x) * MAX_LAYERS + layer
              const idx = (y * maxX + x) * maxLayers + l;
              const tileId = new Int16Array(this.memory.buffer, dataOffset + idx * 2, 1)[0];
              if (tileId >= 0) {
                ctx.fillStyle = `hsl(${(tileId * 37) % 360}, 60%, 50%)`;
                ctx.fillRect(px + 2, py + 2, this.tileSize - 4, this.tileSize - 4);
                ctx.fillStyle = '#fff';
                ctx.font = '10px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(tileId.toString(), px + this.tileSize/2, py + this.tileSize/2 + 4);
              }
            }
            
            if (this.showGrid) {
              ctx.strokeStyle = '#333';
              ctx.strokeRect(px, py, this.tileSize, this.tileSize);
            }
          }
        }

        // Draw shift-drag area preview
        if (this.showDragPreview) {
          const ax0 = Math.min(this.dragStartX, this.dragEndX);
          const ay0 = Math.min(this.dragStartY, this.dragEndY);
          const ax1 = Math.max(this.dragStartX, this.dragEndX);
          const ay1 = Math.max(this.dragStartY, this.dragEndY);
          const px = ax0 * this.tileSize;
          const py = ay0 * this.tileSize;
          const pw = (ax1 - ax0 + 1) * this.tileSize;
          const ph = (ay1 - ay0 + 1) * this.tileSize;
          ctx.fillStyle = 'rgba(255, 255, 100, 0.15)';
          ctx.fillRect(px, py, pw, ph);
          ctx.strokeStyle = 'rgba(255, 255, 100, 0.8)';
          ctx.lineWidth = 2;
          ctx.strokeRect(px + 1, py + 1, pw - 2, ph - 2);
          ctx.lineWidth = 1;
        }
      }
    }

    function log(msg) {
      const output = document.getElementById('output');
      output.textContent += msg + '\n';
      output.scrollTop = output.scrollHeight;
    }

    const editor = new STBTileEditor();
    editor.init().catch(err => {
      log('Error: ' + err.message);
      console.error(err);
    });
  </script>
</body>
</html>
