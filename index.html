<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STB Tilemap Editor - Headless WASM</title>
  <style>
    body {
      font-family: monospace;
      margin: 20px;
      background: #1a1a1a;
      color: #ddd;
    }

    h1 {
      color: #8f8;
    }

    h2 {
      color: #88f;
      margin-top: 30px;
    }

    .section {
      background: #2a2a2a;
      padding: 15px;
      margin: 10px 0;
      border-radius: 5px;
    }

    button {
      background: #444;
      color: #fff;
      border: 1px solid #666;
      padding: 8px 15px;
      margin: 5px;
      cursor: pointer;
      border-radius: 3px;
    }

    button:hover {
      background: #555;
    }

    button.active {
      background: #484;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .tool-btn {
      min-width: 100px;
    }

    .layer-btn {
      min-width: 80px;
    }

    #tilemap {
      border: 2px solid #666;
      background: #000;
      cursor: crosshair;
      image-rendering: pixelated;
    }

    .info {
      font-size: 12px;
      color: #888;
    }

    .tile-grid {
      display: grid;
      grid-template-columns: repeat(8, 32px);
      gap: 2px;
      margin: 10px 0;
    }

    .tile-btn {
      width: 32px;
      height: 32px;
      background: #333;
      border: 1px solid #555;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }

    .tile-btn:hover {
      background: #444;
    }

    .tile-btn.active {
      border: 2px solid #8f8;
    }

    .category-tabs {
      display: flex;
      gap: 5px;
      margin: 10px 0;
    }

    .category-tab {
      padding: 5px 15px;
      background: #333;
      border: 1px solid #555;
      cursor: pointer;
    }

    .category-tab:hover {
      background: #444;
    }

    .category-tab.active {
      background: #448;
      border-color: #66f;
    }

    #output {
      background: #111;
      padding: 10px;
      border-radius: 3px;
      font-size: 11px;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .control-group {
      display: inline-block;
      margin: 0 15px 10px 0;
      vertical-align: top;
    }

    label {
      display: block;
      font-size: 11px;
      margin-bottom: 5px;
      color: #888;
    }
  </style>
</head>

<body>
  <h1>STB Tilemap Editor - Headless WASM</h1>
  <p class="info">Pure WASM implementation with HTML/Canvas UI. No properties or links.</p>

  <div class="section">
    <h2>Tools</h2>
    <div id="tools">
      <button class="tool-btn" data-tool="0">Select</button>
      <button class="tool-btn active" data-tool="1">Brush</button>
      <button class="tool-btn" data-tool="2">Erase</button>
      <button class="tool-btn" data-tool="3">Rectangle</button>
      <button class="tool-btn" data-tool="4">Eyedropper</button>
    </div>
    <div style="margin-top: 10px;">
      <button id="undo-btn">Undo</button>
      <button id="redo-btn">Redo</button>
      <button id="cut-btn">Cut</button>
      <button id="copy-btn">Copy</button>
      <button id="paste-btn">Paste</button>
    </div>
  </div>

  <div class="section">
    <h2>Layers</h2>
    <div id="layers"></div>
  </div>

  <div class="section">
    <h2>Categories</h2>
    <div id="categories" class="category-tabs"></div>
  </div>

  <div class="section">
    <h2>Tiles</h2>
    <div id="tiles" class="tile-grid"></div>
  </div>

  <div class="section">
    <h2>Map <span class="info">(Click to draw, Right-click to erase)</span></h2>
    <canvas id="tilemap" width="640" height="480"></canvas>
    <div style="margin-top: 10px;">
      <button id="clear-btn">Clear Map</button>
      <button id="grid-btn">Toggle Grid</button>
    </div>
  </div>

  <div class="section">
    <h2>Debug Output</h2>
    <div id="output">Loading WASM...</div>
  </div>

  <script type="module">
    // WASM Module loader and API wrapper
    class STBTileEditor {
      constructor() {
        this.wasm = null;
        this.memory = null;
        this.exports = null;
        this.tilemap = 0;
        this.tileSize = 32;
        this.mapWidth = 20;
        this.mapHeight = 15;
        this.layers = 3;
        this.currentTool = 1; // Brush
        this.selectedTile = 0;
        this.selectedLayer = -1;
        this.showGrid = true;
        this.clipboard = null;
      }

      async init() {
        const response = await fetch('./stb_tilemap_editor.wasm');
        const wasmBytes = await response.arrayBuffer();

        const importObject = {
          env: {
            memory: new WebAssembly.Memory({initial: 256, maximum: 512})
          }
        };

        const {instance} = await WebAssembly.instantiate(wasmBytes, importObject);
        this.wasm = instance;
        this.memory = instance.exports.memory;
        this.exports = instance.exports;

        // Log all exported functions
        console.log('=== WASM Exported Functions ===');
        const exports = Object.keys(instance.exports).sort();
        const delme = []
        exports.forEach(name => {
          const type = typeof instance.exports[name];
          delme.push(`  ${name}: ${type}`)
          console.log(`  ${name}: ${type}`);
        });
        console.log(`Total exports: ${exports.length}`);
        console.log(delme.join("\n"))

        // Create tilemap
        this.tilemap = this.exports.stbte_create(
          this.mapWidth,
          this.mapHeight,
          this.layers,
          this.tileSize,
          this.tileSize,
          256
        );

        // Define some test tiles
        this.defineTiles();

        // Set background tile
        this.exports.stbte_set_background_tile(this.tilemap, 0);

        log('WASM initialized successfully!');
        log(`Tilemap: ${this.mapWidth}x${this.mapHeight}, ${this.layers} layers`);

        this.setupUI();
        this.render();
      }

      defineTiles() {
        // Define tiles with IDs and categories
        const tiles = [
          {id: 0, mask: 0xFF, cat: 'default'},
          {id: 1, mask: 0x01, cat: 'floor'},
          {id: 2, mask: 0x01, cat: 'floor'},
          {id: 3, mask: 0x01, cat: 'floor'},
          {id: 10, mask: 0x02, cat: 'walls'},
          {id: 11, mask: 0x02, cat: 'walls'},
          {id: 12, mask: 0x02, cat: 'walls'},
          {id: 20, mask: 0x04, cat: 'objects'},
          {id: 21, mask: 0x04, cat: 'objects'},
          {id: 22, mask: 0x04, cat: 'objects'},
          {id: 23, mask: 0x04, cat: 'objects'},
        ];

        tiles.forEach(tile => {
          const catPtr = this.stringToPtr(tile.cat);
          this.exports.stbte_define_tile(this.tilemap, tile.id, tile.mask, catPtr);
        });

        log(`Defined ${tiles.length} tiles`);
      }

      stringToPtr(str) {
        const encoder = new TextEncoder();
        const bytes = encoder.encode(str + '\0');
        const ptr = this.exports.malloc(bytes.length);
        const mem = new Uint8Array(this.memory.buffer, ptr, bytes.length);
        mem.set(bytes);
        return ptr;
      }

      ptrToString(ptr) {
        const mem = new Uint8Array(this.memory.buffer);
        let str = '';
        while (mem[ptr] !== 0) {
          str += String.fromCharCode(mem[ptr++]);
        }
        return str;
      }

      setupUI() {
        // Tools
        document.querySelectorAll('.tool-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.currentTool = parseInt(btn.dataset.tool);
            this.exports.stbte_set_tool(this.tilemap, this.currentTool);
          });
        });

        // Undo/Redo
        document.getElementById('undo-btn').addEventListener('click', () => {
          this.exports.stbte_undo(this.tilemap);
          this.render();
          log('Undo');
        });

        document.getElementById('redo-btn').addEventListener('click', () => {
          this.exports.stbte_redo(this.tilemap);
          this.render();
          log('Redo');
        });

        // Cut/Copy/Paste
        document.getElementById('cut-btn').addEventListener('click', () => {
          this.exports.stbte_cut(this.tilemap);
          this.render();
          log('Cut selection');
        });

        document.getElementById('copy-btn').addEventListener('click', () => {
          this.exports.stbte_copy(this.tilemap);
          log('Copy selection');
        });

        document.getElementById('paste-btn').addEventListener('click', () => {
          // Paste at center of map
          const cx = Math.floor(this.mapWidth / 2);
          const cy = Math.floor(this.mapHeight / 2);
          this.exports.stbte_paste(this.tilemap, cx, cy);
          this.render();
          log(`Paste at ${cx},${cy}`);
        });

        // Clear
        document.getElementById('clear-btn').addEventListener('click', () => {
          this.exports.stbte_clear(this.tilemap);
          this.render();
          log('Map cleared');
        });

        // Grid toggle
        document.getElementById('grid-btn').addEventListener('click', () => {
          this.showGrid = !this.showGrid;
          this.render();
        });

        // Canvas interaction
        const canvas = document.getElementById('tilemap');
        let isDragging = false;
        let dragStart = null;

        canvas.addEventListener('mousedown', (e) => {
          const rect = canvas.getBoundingClientRect();
          const x = Math.floor((e.clientX - rect.left) / this.tileSize);
          const y = Math.floor((e.clientY - rect.top) / this.tileSize);

          if (x >= 0 && x < this.mapWidth && y >= 0 && y < this.mapHeight) {
            isDragging = true;
            dragStart = {x, y};

            const button = e.button === 2 ? 1 : 0; // Right click = erase
            this.exports.stbte_set_tool(this.tilemap, this.currentTool);
            this.exports.stbte_click_tile(this.tilemap, x, y, button);
            this.render();
            log(`Click at ${x},${y} (button: ${button})`);
          }
        });

        canvas.addEventListener('mousemove', (e) => {
          if (!isDragging) return;

          const rect = canvas.getBoundingClientRect();
          const x = Math.floor((e.clientX - rect.left) / this.tileSize);
          const y = Math.floor((e.clientY - rect.top) / this.tileSize);

          if (x >= 0 && x < this.mapWidth && y >= 0 && y < this.mapHeight) {
            // For brush tool, paint while dragging
            if (this.currentTool === 1) {
              const button = e.button === 2 ? 1 : 0;
              this.exports.stbte_click_tile(this.tilemap, x, y, button);
              this.render();
            }
          }
        });

        canvas.addEventListener('mouseup', () => {
          isDragging = false;
          dragStart = null;
        });

        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        this.setupLayers();
        this.setupCategories();
        this.setupTiles();
      }

      setupLayers() {
        const container = document.getElementById('layers');
        container.innerHTML = '';

        for (let i = 0; i < this.layers; i++) {
          const btn = document.createElement('button');
          btn.className = 'layer-btn' + (i === this.selectedLayer ? ' active' : '');
          btn.textContent = `Layer ${i + 1}`;
          btn.addEventListener('click', () => {
            this.selectedLayer = this.selectedLayer === i ? -1 : i;
            this.exports.stbte_set_active_layer(this.tilemap, this.selectedLayer);
            this.setupLayers();
            log(`Active layer: ${this.selectedLayer}`);
          });
          container.appendChild(btn);
        }
      }

      setupCategories() {
        const container = document.getElementById('categories');
        container.innerHTML = '';

        const catCount = this.exports.stbte_get_category_count(this.tilemap);
        log(`Categories: ${catCount}`);

        // Add "All" tab
        const allTab = document.createElement('div');
        allTab.className = 'category-tab active';
        allTab.textContent = 'All';
        allTab.addEventListener('click', () => {
          this.exports.stbte_set_active_category(this.tilemap, -1);
          this.setupCategories();
          this.setupTiles();
        });
        container.appendChild(allTab);

        for (let i = 0; i < catCount; i++) {
          const catPtr = this.exports.stbte_get_category_name(this.tilemap, i);
          const catName = this.ptrToString(catPtr);

          const tab = document.createElement('div');
          tab.className = 'category-tab';
          tab.textContent = catName;
          tab.addEventListener('click', () => {
            this.exports.stbte_set_active_category(this.tilemap, i);
            this.setupCategories();
            this.setupTiles();
          });
          container.appendChild(tab);
        }
      }

      setupTiles() {
        const container = document.getElementById('tiles');
        container.innerHTML = '';

        const tileCount = this.exports.stbte_get_tile_count(this.tilemap);
        const activeCat = this.exports.stbte_get_active_category(this.tilemap);

        for (let i = 0; i < tileCount; i++) {
          const tileId = this.exports.stbte_get_tile_id(this.tilemap, i);
          const tileCat = this.exports.stbte_get_tile_category_id(this.tilemap, i);

          // Filter by category
          if (activeCat !== -1 && tileCat !== activeCat) continue;

          const btn = document.createElement('div');
          btn.className = 'tile-btn' + (i === this.selectedTile ? ' active' : '');
          btn.textContent = tileId;
          btn.addEventListener('click', () => {
            this.selectedTile = i;
            this.exports.stbte_set_active_tile(this.tilemap, i);
            this.setupTiles();
            log(`Selected tile: ${tileId}`);
          });
          container.appendChild(btn);
        }
      }

      render() {
        const canvas = document.getElementById('tilemap');
        const ctx = canvas.getContext('2d');

        // Clear
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Get tile data pointer
        const dataPtr = this.exports.stbte_get_map_data_ptr(this.tilemap);
        const data = new Int16Array(this.memory.buffer, dataPtr, this.mapWidth * this.mapHeight * this.layers);

        // Render tiles (simple colored squares for demo)
        for (let y = 0; y < this.mapHeight; y++) {
          for (let x = 0; x < this.mapWidth; x++) {
            const px = x * this.tileSize;
            const py = y * this.tileSize;

            // Draw background
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(px, py, this.tileSize, this.tileSize);

            // Draw tiles from all layers
            for (let l = 0; l < this.layers; l++) {
              const idx = (y * this.mapWidth + x) * this.layers + l;
              const tileId = data[idx];

              if (tileId >= 0) {
                // Simple color based on tile ID
                const hue = (tileId * 37) % 360;
                ctx.fillStyle = `hsl(${hue}, 60%, 50%)`;
                ctx.fillRect(px + 2, py + 2, this.tileSize - 4, this.tileSize - 4);

                // Draw tile ID
                ctx.fillStyle = '#fff';
                ctx.font = '10px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(tileId.toString(), px + this.tileSize / 2, py + this.tileSize / 2 + 4);
              }
            }

            // Grid
            if (this.showGrid) {
              ctx.strokeStyle = '#333';
              ctx.strokeRect(px, py, this.tileSize, this.tileSize);
            }
          }
        }

        // Draw selection if exists
        const hasSel = this.exports.stbte_has_selection(this.tilemap);
        if (hasSel) {
          const selPtr = this.exports.malloc(16);
          this.exports.stbte_get_selection(this.tilemap, selPtr, selPtr + 4, selPtr + 8, selPtr + 12);
          const sel = new Int32Array(this.memory.buffer, selPtr, 4);
          const [x0, y0, x1, y1] = [sel[0], sel[1], sel[2], sel[3]];

          ctx.strokeStyle = '#8f8';
          ctx.lineWidth = 2;
          ctx.strokeRect(
            x0 * this.tileSize,
            y0 * this.tileSize,
            (x1 - x0 + 1) * this.tileSize,
            (y1 - y0 + 1) * this.tileSize
          );
        }
      }
    }

    // Logger
    function log(msg) {
      const output = document.getElementById('output');
      output.textContent += msg + '\n';
      output.scrollTop = output.scrollHeight;
    }

    // Initialize
    const editor = new STBTileEditor();
    editor.init().catch(err => {
      log('Error: ' + err.message);
      console.error(err);
    });
  </script>
</body>

</html>
