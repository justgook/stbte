name: build-deploy

on:
  workflow_dispatch:
  push:
    branches:
      - release
    tags:
      - "v*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
      - name: Build web deployment
        run: make web
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build.nosync/web/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
